<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shared with you · Synclayer</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="sharepage">
<main class="center">
  <div class="card sharecard">
    <div class="logo"><span class="mark"></span><span>Synclayer</span></div>
    <h1 id="shName">Loading…</h1>
    <p id="shMeta" class="muted"></p>
    <form id="pwForm" class="form hidden">
      <label>This link is password protected<input id="pw" type="password" autocomplete="off"></label>
      <button class="btn primary" type="submit">Open</button>
    </form>
    <p id="err" class="err"></p>
    <div id="pv" class="spv"></div>
    <div id="crumbs" class="crumbs"></div>
    <div id="list" class="shlist"></div>
    <div class="row end"><a id="dl" class="btn primary hidden" href="#">Download</a></div>
  </div>
</main>
<script src="/static/share.js"></script>
</body>
</html>
