name: Release

# Runs when a version tag is pushed (or manually to build the apps only) (python scripts/pypimgr/pypimgr.py release --push does this for you).
# It re-checks and builds, creates the GitHub release, then publishes to TestPyPI and PyPI
# using configured Trusted Publishers (GitHub OIDC; no long-lived API tokens).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Default server address baked into the apps (optional)"
        required: false

permissions:
  contents: read

env:
  CI: "true"
  BAKED_SERVER: ${{ github.event.inputs.server_url || vars.SL_BUILD_SERVER }}


jobs:
  apps:
    name: Build apps (${{ matrix.os }})
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04-arm    # Linux ARM64; best effort, never blocks the release
            experimental: true
          - os: windows-latest
          - os: macos-latest        # Apple Silicon; best effort, never blocks the release
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Linux libraries needed by Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"
      - name: Build
        shell: bash
        run: |
          if [ -n "$BAKED_SERVER" ]; then
            python scripts/build.py --package --server "$BAKED_SERVER"
          else
            python scripts/build.py --package
          fi
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path synclayer/_version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" packaging\windows\synclayer.iss
      - name: Linux .deb package
        if: runner.os == 'Linux'
        run: bash packaging/linux/make-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apps-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.deb
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true          # never blocks the desktop release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (preinstalled SDK on the runner)
        shell: bash
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Optional release keystore (repository secrets)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/synclayer.jks"
            echo "SL_KEYSTORE_FILE=$RUNNER_TEMP/synclayer.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        shell: bash
        env:
          SL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VER=$(grep -oP '__version__\s*=\s*"\K[^"]+' synclayer/_version.py)
          gradle -p android --no-daemon assembleRelease ${BAKED_SERVER:+-PslServer="$BAKED_SERVER"}
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/synclayer-$VER-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apps-Android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.apps.result != 'failure' }}
    needs: [apps, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('synclayer/_version.py').read_text()).group(1))")
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match package version v$v" >&2
            exit 1
          fi
      - run: pip install -e ".[dev]" build twine
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/pypimgr/pypimgr.py build
        env:
          PYPIMGR_NO_VENV: "1"
      - name: Release notes from CHANGELOG.md
        run: python scripts/pypimgr/pypimgr.py notes "${GITHUB_REF_NAME}" > notes.md
      - name: Collect artifacts
        run: mkdir -p dist && cp .cache/pypimgr/synclayer/artifacts/* dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: apps-*
          path: app-assets
          merge-multiple: true
        continue-on-error: true
      - name: Add desktop and Android apps
        run: cp -n app-assets/* dist/ 2>/dev/null || true
      - name: Replace any existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: .cache/pypimgr/synclayer/artifacts/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/synclayer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Check whether this version is already on TestPyPI
        id: existing
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://test.pypi.org/pypi/synclayer/${version}/json")"
          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "synclayer ${version} is already on TestPyPI; skipping upload."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not check TestPyPI (HTTP ${status})." >&2
              exit 1
              ;;
          esac
      - name: Upload distributions to TestPyPI
        if: steps.existing.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: [release, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synclayer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Check whether this version is already on PyPI
        id: existing
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/synclayer/${version}/json")"
          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "synclayer ${version} is already on PyPI; skipping upload."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not check PyPI (HTTP ${status})." >&2
              exit 1
              ;;
          esac
      - name: Upload distributions to PyPI
        if: steps.existing.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Server image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
